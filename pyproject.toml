[project]
name = "camnerd"
version = "0.1.0"
description = "Extract camera metadata from photos and analyse your frequent settings"
requires-python = ">=3.13"
dependencies = [
    "exifread>=3.5.1",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
camnerd = "camnerd.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
